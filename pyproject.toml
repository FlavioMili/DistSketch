[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distsketch"
version = "0.1.0"
description = "Draw integer distributions and generate large datasets from a local web editor."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
distsketch = "distribution_drawing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
distribution_drawing = ["web/*", "native/*.cpp", "native/include/*.hpp"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
